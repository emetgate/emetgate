name: release

on:
  push:
    tags: ["v*"]

env:
  ZIG_VERSION: "0.16.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the manifest version
        shell: pwsh
        run: |
          $m = Select-String -Path build.zig.zon -Pattern '\.version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "build.zig.zon has no .version" }
          $want = "v" + $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne $want) { throw "tag $env:GITHUB_REF_NAME does not match build.zig.zon version $want" }
      - uses: ./.github/actions/setup
      - run: zig build test -Doptimize=ReleaseSafe -Dcpu=baseline --summary all
      - run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline
      - name: Smoke-test the built binary
        shell: pwsh
        run: |
          $out = & zig-out/bin/emetgate.exe symbols tests/bench/master/calc.ts
          if ($LASTEXITCODE -ne 0) { throw "emetgate symbols exited with $LASTEXITCODE" }
          $out
          if (-not ($out -match "function\s+add$")) { throw "emetgate symbols did not list add" }
          $v = (& zig-out/bin/emetgate.exe --version | Out-String).Trim()
          if (-not $v.Contains($env:GITHUB_REF_NAME.TrimStart('v'))) { throw "emetgate --version printed '$v', expected $env:GITHUB_REF_NAME" }
      - name: Compute the SHA-256 checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item zig-out/bin/emetgate.exe dist/emetgate.exe
          $hash = (Get-FileHash dist/emetgate.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  emetgate.exe" | Out-File -FilePath dist/emetgate.exe.sha256 -Encoding ascii -NoNewline
          Get-Content dist/emetgate.exe.sha256
      - name: Attest that this binary was built from this commit
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/emetgate.exe
      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/emetgate.exe dist/emetgate.exe.sha256 --title "$env:GITHUB_REF_NAME" --generate-notes --verify-tag
