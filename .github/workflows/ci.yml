name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      llm_attack:
        description: Also run the LLM-driven nightly attacker (needs the ANTHROPIC_API_KEY secret; costs tokens)
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

env:
  ZIG_VERSION: "0.16.0"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    name: test (${{ matrix.optimize }})
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        shell: pwsh
        run: |
          $zip = "zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/$zip"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\zig"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig\zig-x86_64-windows-$env:ZIG_VERSION"
      - run: zig version
      - run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - name: Set up Python
        if: matrix.optimize == 'Debug'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verification page, README facts and forbidden words are up to date
        if: matrix.optimize == 'Debug'
        run: |
          python tools/verification_page.py --check
          python tools/readme_facts.py --check
          python tools/forbidden_words.py --check
          python tools/vendor_manifest.py --check

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      SLICE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        shell: pwsh
        run: |
          $zip = "zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/$zip"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\zig"
          Remove-Item $zip
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig\zig-x86_64-windows-$env:ZIG_VERSION"
      - run: zig version
      - name: Require a clean working tree
        shell: pwsh
        run: |
          $dirty = git status --porcelain --untracked-files=all
          if ($dirty) {
            Write-Output "::error::the mutation harness needs a clean working tree"
            $dirty
            exit 1
          }
      - name: Every test, the slow ones included
        run: zig build test -Dslow=true --summary all
      - name: Every test 20 times under load
        shell: pwsh
        run: |
          zig build test-bin
          $exe = (Resolve-Path ./zig-out/bin/test-all.exe).Path
          $here = (Get-Location).Path
          $load = Start-Job -ArgumentList $exe, $here -ScriptBlock {
            param($exe, $here)
            Set-Location $here
            while ($true) { & $exe --jobs 2 --slow *> $null }
          }
          try {
            for ($i = 1; $i -le 20; $i++) {
              Write-Output "run $i of 20"
              & $exe --jobs 8 --slow
              if ($LASTEXITCODE -ne 0) { Write-Output "::error::run $i of 20 failed"; exit 1 }
            }
          } finally {
            Stop-Job $load
            Remove-Job $load -Force
          }
      - run: zig build mutate-tool
      - name: The whole mutation corpus from the schema binary
        shell: pwsh
        run: ./zig-out/bin/emetgate-mutate.exe --jobs=4
      - name: Summarize unexpected outcomes
        if: always()
        shell: pwsh
        run: |
          $path = ".zig-cache/mutate/report.json"
          if (-not (Test-Path $path)) {
            "No report was written; see the harness log above." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $outcomes = Get-Content $path -Raw | ConvertFrom-Json
          $bad = @($outcomes | Where-Object { -not $_.ok })
          $schema = @($outcomes | Where-Object { $_.origin -eq 'schema' }).Count
          "## Mutation corpus" >> $env:GITHUB_STEP_SUMMARY
          "$($outcomes.Count) run ($schema from the schema binary), $($outcomes.Count - $bad.Count) as expected, $($bad.Count) not as expected" >> $env:GITHUB_STEP_SUMMARY
          if ($bad.Count -gt 0) {
            "" >> $env:GITHUB_STEP_SUMMARY
            "| id | file | status | wanted | why |" >> $env:GITHUB_STEP_SUMMARY
            "|---|---|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
            foreach ($o in $bad) {
              $why = @($o.detail, $(if ($o.missing_kill) { "did not fail: $($o.missing_kill)" }), $(if ($o.unexpected_kill) { "failed unexpectedly: $($o.unexpected_kill)" })) | Where-Object { $_ }
              "| $($o.id) | $($o.file) | $($o.status) | $($o.expected_status) | $($why -join '; ') |" >> $env:GITHUB_STEP_SUMMARY
              Write-Output "::error title=$($o.id)::status=$($o.status) wanted=$($o.expected_status) $($why -join '; ')"
            }
          }
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .zig-cache/mutate/report.json
          if-no-files-found: warn
      - name: A rotating tenth of the corpus, schema binary against one build per mutant
        shell: pwsh
        run: |
          $slice = ([int]$env:SLICE % 10) + 1
          ./zig-out/bin/emetgate-mutate.exe --jobs=4 --skip-survivors --compare "--slice=$slice/10"

  nightly-attacker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        shell: pwsh
        run: |
          $zip = "zig-x86_64-windows-$env:ZIG_VERSION.zip"
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/$zip"
          Invoke-WebRequest $url -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\zig"
          Remove-Item $zip
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig\zig-x86_64-windows-$env:ZIG_VERSION"
      - run: zig build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Script mode corpus (every night, no API key needed)
        run: python tools/attack/run.py
      - name: MCP tool description scan (every night, no API key needed)
        run: |
          python -m pip install -r tools/redteam/requirements.txt
          python tools/redteam/scan_tools.py
      - name: LLM mode (opt-in, needs the ANTHROPIC_API_KEY secret and an explicit dispatch input)
        if: github.event_name == 'workflow_dispatch' && inputs.llm_attack == true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python tools/attack/llm_mode.py
