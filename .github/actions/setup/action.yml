name: setup
description: Enable 8.3 short names and install the pinned Zig, Python with pytest, and ripgrep
runs:
  using: composite
  steps:
    - name: Enable 8.3 short names on the work and temp volumes
      shell: pwsh
      run: |
        fsutil 8dot3name set 2
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $drives = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP) | ForEach-Object { Split-Path -Qualifier $_ } | Sort-Object -Unique
        foreach ($drive in $drives) {
          fsutil 8dot3name set $drive 0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          fsutil 8dot3name query $drive
        }
    - name: Restore the Zig and ripgrep downloads
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/downloads
        key: tool-downloads-zig-${{ env.ZIG_VERSION }}-rg-14.1.1
    - name: Install Zig
      shell: pwsh
      run: |
        $dl = "$env:RUNNER_TEMP\downloads"
        New-Item -ItemType Directory -Force $dl | Out-Null
        $zip = "$dl\zig-x86_64-windows-$env:ZIG_VERSION.zip"
        if (-not (Test-Path $zip)) {
          $url = "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip"
          Invoke-WebRequest $url -OutFile $zip
        }
        New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\zig" | Out-Null
        tar -xf $zip -C "$env:RUNNER_TEMP\zig"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\zig\zig-x86_64-windows-$env:ZIG_VERSION"
    - shell: pwsh
      run: zig version
    - uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pytest
      shell: pwsh
      run: python -m pip install pytest==8.3.5
    - name: Install ripgrep
      shell: pwsh
      run: |
        $version = "14.1.1"
        $name = "ripgrep-$version-x86_64-pc-windows-msvc"
        $url = "https://github.com/BurntSushi/ripgrep/releases/download/$version/$name.zip"
        $zip = "$env:RUNNER_TEMP\downloads\$name.zip"
        if (-not (Test-Path $zip)) { Invoke-WebRequest $url -OutFile $zip }
        New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\rg" | Out-Null
        tar -xf $zip -C "$env:RUNNER_TEMP\rg"
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $dir = "$env:RUNNER_TEMP\rg\$name"
        Add-Content -Path $env:GITHUB_PATH -Value $dir
        & "$dir\rg.exe" --version
        if ($LASTEXITCODE -ne 0) { exit 1 }
